{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add New Post</title>

    <link rel="stylesheet" href="{% static 'posts/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Add New Post</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Title:</label>
            <input type="text" name="title">

            <label>Body:</label>
            <textarea name="body" rows="8"></textarea>

            <button type="submit">Add Post</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">
            Back to Home
        </a>

    </div>

</body>
</html>
